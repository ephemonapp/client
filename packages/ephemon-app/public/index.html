<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
            name="viewport"
        />
        <script>
            <%= htmlWebpackPlugin.options.templateParameters.themeBootstrap %>
        </script>
        <style>
            <%= htmlWebpackPlugin.options.templateParameters.themeCss %>
        </style>
        <meta
            content="#6A5BFF"
            name="theme-color"
        />
        <meta
            content="yes"
            name="mobile-web-app-capable"
        />
        <meta
            content="yes"
            name="apple-mobile-web-app-capable"
        />
        <meta
            content="black-translucent"
            name="apple-mobile-web-app-status-bar-style"
        />
        <meta
            content="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_APP_NAME %>"
            name="apple-mobile-web-app-title"
        />
        <meta
            content="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_APP_NAME %> is an end-to-end encrypted peer-to-peer messenger. No accounts, no phone numbers — your private keys and message history never leave your device."
            name="description"
        />
        <title><%= htmlWebpackPlugin.options.templateParameters.EPHEMON_APP_NAME %></title>
        <link
            as="font"
            crossorigin
            href="/assets/fonts/hanken-grotesk-v12-latin.woff2"
            rel="preload"
            type="font/woff2"
        />
        <link
            as="font"
            crossorigin
            href="/assets/fonts/jetbrains-mono-v24-latin.woff2"
            rel="preload"
            type="font/woff2"
        />
        <style>
            @font-face {
                font-family: 'Hanken Grotesk';
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
                src: url('/assets/fonts/hanken-grotesk-v12-latin.woff2') format('woff2');
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
                    U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: 'Hanken Grotesk';
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
                src: url('/assets/fonts/hanken-grotesk-v12-latin-ext.woff2') format('woff2');
                unicode-range:
                    U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
                    U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
                    U+A720-A7FF;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: normal;
                font-weight: 400 800;
                font-display: swap;
                src: url('/assets/fonts/jetbrains-mono-v24-latin.woff2') format('woff2');
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
                    U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: normal;
                font-weight: 400 800;
                font-display: swap;
                src: url('/assets/fonts/jetbrains-mono-v24-latin-ext.woff2') format('woff2');
                unicode-range:
                    U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
                    U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F,
                    U+A720-A7FF;
            }
            @font-face {
                font-family: 'JetBrains Mono';
                font-style: normal;
                font-weight: 400 800;
                font-display: swap;
                src: url('/assets/fonts/jetbrains-mono-v24-cyrillic.woff2') format('woff2');
                unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
            }
        </style>
        <!--suppress HtmlUnknownTarget -->
        <link
            href="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/assets/apple-touch-icon.png?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
            rel="apple-touch-icon"
            sizes="180x180"
        />
        <!--suppress HtmlUnknownTarget -->
        <link
            href="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/assets/favicon.svg?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
            rel="icon"
            type="image/svg+xml"
        />
        <!--suppress HtmlUnknownTarget -->
        <link
            href="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/assets/favicon-32x32.png?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
            rel="icon"
            sizes="32x32"
            type="image/png"
        />
        <!--suppress HtmlUnknownTarget -->
        <link
            href="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/manifest.json?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
            rel="manifest"
        />
        <% if (htmlWebpackPlugin.options.templateParameters.inlineStyles) { %>
        <style>
            <%= compilation.getAsset(htmlWebpackPlugin.options.templateParameters.bundleName + '.css').source.source() %>
        </style>
        <% } else { %>
        <!--suppress HtmlUnknownTarget -->
        <link
            href="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/<%= htmlWebpackPlugin.options.templateParameters.bundleName %>.css?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
            rel="stylesheet"
        />
        <% } %>
    </head>
    <body>
        <% if (htmlWebpackPlugin.options.templateParameters.lockSkeletonMarkup) { %>
        <div
            aria-hidden="true"
            id="lock-skeleton"
        >
            <div class="lock"><%= htmlWebpackPlugin.options.templateParameters.lockSkeletonMarkup %></div>
        </div>
        <% } %>
        <div id="root"></div>
        <!--suppress HtmlUnknownTarget -->
        <script
            defer
            src="<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_CLIENT_URL %>/<%= htmlWebpackPlugin.options.templateParameters.bundleName %>.js?_=<%= htmlWebpackPlugin.options.templateParameters.EPHEMON_BUILD_TIMESTAMP %>"
        ></script>
    </body>
</html>
