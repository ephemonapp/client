[package]
name = "ephemon-mls"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.8.1", features = ["js"] }
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
tls_codec = "=0.4.2"
wasm-bindgen = "=0.2.100"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# openmls's `js` feature configures its current getrandom dependency. The RustCrypto provider and
# basic credential crate still use getrandom 0.2 through rand 0.8, so that generation needs its
# browser backend enabled explicitly as well.
getrandom = { version = "=0.2.17", features = ["js"] }
