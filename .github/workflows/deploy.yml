name: Deploy to S3
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install the pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build MLS WASM
        run: npm run mls:build
      - name: Build and publish
        run: npm run publish --workspace=@ephemon/app
      - name: Generate coverage
        run: npm run coverage:generate
      - name: Copy coverage into dist
        run: npm run coverage:copy
      - name: Upload cache-busted assets with long cache
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --exclude 'index.html' --exclude 'service-worker.js' --exclude 'manifest.json' --exclude '*.map' --exclude 'coverage/**' --cache-control 'public, max-age=31104000, immutable' --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          SOURCE_DIR: packages/ephemon-app/dist
      - name: Upload fixed-url files with no-cache
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --exclude '*' --include 'index.html' --include 'service-worker.js' --include 'manifest.json' --include '*.map' --include 'coverage/**' --cache-control 'no-cache' --follow-symlinks
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
          SOURCE_DIR: packages/ephemon-app/dist
